name: Bug report
description: Report a reproducible problem in ShearingPlate
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        Before submitting:
        - confirm whether you are using `swift run` or the packaged `.app`
        - include your macOS version and machine architecture
        - mention whether Rosetta 2 is installed if you are on Apple Silicon

  - type: input
    id: version
    attributes:
      label: App version
      description: For example `v0.1.0-alpha` or `local build`
      placeholder: v0.1.0-alpha
    validations:
      required: true

  - type: dropdown
    id: install_type
    attributes:
      label: How are you running the app?
      options:
        - Packaged .app
        - Test zip package
        - swift run
        - Other
    validations:
      required: true

  - type: input
    id: macos_version
    attributes:
      label: macOS version
      placeholder: macOS 15.4
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Machine architecture
      options:
        - Intel Mac
        - Apple Silicon Mac
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: rosetta
    attributes:
      label: Rosetta 2 installed?
      options:
        - Yes
        - No
        - Not applicable
        - Not sure
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide exact steps so the issue can be reproduced
      placeholder: |
        1. Launch the app
        2. Copy text A
        3. Open the panel
        4. Observe the problem
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Extra context
      description: Logs, screenshots, settings, or anything else that may help

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues first
          required: true
        - label: I included enough detail to reproduce the issue
          required: true
